version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: alphaforge-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [alphaforge]

  mongo:
    image: mongo:7
    container_name: alphaforge-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [alphaforge]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphaforge-backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [alphaforge]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphaforge-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [alphaforge]

volumes:
  redis-data:
  mongo-data:

networks:
  alphaforge:
    driver: bridge
