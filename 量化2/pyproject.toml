[project]
name = "qmt-data-platform"
version = "0.1.0"
description = "Local-first China A-share data platform powered by QMT/XtQuant"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
qdp = "qmt_data_platform.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmt_data_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
